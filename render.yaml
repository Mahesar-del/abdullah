services:
  - type: web
    name: tradesense-pro-live
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn trading_platform.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "tradesense-pro-live.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
